[project]
name = "fore"
version = "0.1.0"
description = "FoRE: MTP-guided early forking and suffix regeneration on a fine-tuned DFlash drafter, with inference and fine-tuning for Qwen3.5-9B and Qwen3.5-4B"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.11.*"
# Versions for the Qwen3.5 FoRE runs (H200, CUDA 13.0 torch wheels from PyPI).
# transformers is pinned hard: the hybrid verifier reads Qwen3.5's cache-layer attributes
# (conv_states, recurrent_states) and the GatedDeltaNet module's kernel entry points.
dependencies = [
    "torch==2.12.0",
    "transformers==5.9.0",
    "accelerate==1.13.0",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "huggingface-hub==1.16.1",
    "numpy==2.4.6",
    "einops==0.8.2",
    "flash-linear-attention==0.5.1",
    "fla-core==0.5.1",
    "causal-conv1d==1.6.2.post1",
]

[project.optional-dependencies]
# Needed only for FlashAttention 2 (`fore-generate --attention flash_attention_2`, the default).
# It compiles from source against the pinned torch, which takes a long time.
flash-attn = ["flash-attn==2.8.3.post1"]
# Fine-tuning (fore.train) and the training-data scripts in scripts/.
train = ["datasets==4.8.5", "pydantic==2.13.4", "yunchang==0.6.4"]
# The client half of response regeneration (scripts/regenerate_train_data.py). The SGLang
# servers it queries pin torch 2.11, so they get their own environment (scripts/build_sglang_env.sh).
regen = ["openai==2.6.1"]

[project.scripts]
fore-generate = "fore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Every transitive package at the version installed on the machine that produced the
# reported numbers. The regen extra's client-only packages (distro, jiter, openai, sniffio)
# are at the versions of the environment that ran the regeneration client.
